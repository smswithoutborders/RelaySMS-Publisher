# dclint disable no-build-and-image service-image-require-explicit-tag no-unbound-port-interfaces
# The image is built here, and the ports are meant to be reachable from outside.
services:
  publisher:
    image: relaysms-publisher:latest
    build: .
    container_name: relaysms-publisher
    volumes:
      - ./data:/publisher/data
    # Listens on every interface in the container, whatever .env sets.
    environment:
      HOST: 0.0.0.0
      GRPC_HOST: 0.0.0.0
    env_file: .env
    ports:
      - "${GRPC_PORT:-6000}:${GRPC_PORT:-6000}"
      - "${PORT:-16000}:${PORT:-16000}"
    restart: unless-stopped
