services:
  publisher:
    build: .
    image: relaysms-publisher:latest
    container_name: relaysms-publisher
    restart: unless-stopped
    env_file: .env
    # HOST/GRPC_HOST default to 127.0.0.1 in .env, which would make the
    # container unreachable from outside. Override regardless of what .env
    # has, since inside a container 0.0.0.0 is the only sensible bind.
    environment:
      HOST: 0.0.0.0
      GRPC_HOST: 0.0.0.0
    ports:
      - "${PORT:-16000}:${PORT:-16000}"
      - "${GRPC_PORT:-6000}:${GRPC_PORT:-6000}"
    volumes:
      - ./data:/publisher/data
      - ./platforms:/publisher/platforms
      - ./gateway_clients:/publisher/gateway_clients
