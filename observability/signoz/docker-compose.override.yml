# Resource caps and hardening for Foundry's generated
# pours/deployment/compose.yaml, which foundryctl cast overwrites.
#
# Service names come from casting.yaml's metadata.name
# (relaysms-publisher-signoz). If `docker compose up -d` errors about an
# unknown service, list the generated names with:
#   docker compose -f pours/deployment/compose.yaml config --services
services:
  ingester:
    mem_limit: 512m
    mem_reservation: 128m
    security_opt:
      - no-new-privileges:true

  relaysms-publisher-signoz-signoz-0:
    mem_limit: 1g
    mem_reservation: 256m
    security_opt:
      - no-new-privileges:true

  relaysms-publisher-signoz-telemetrystore-clickhouse-0-0:
    mem_limit: 3g
    mem_reservation: 1g
    security_opt:
      - no-new-privileges:true
