[tool.ruff]
target-version = "py314"
line-length = 88
# protocol_interfaces.py is copied verbatim into adapter repositories.
extend-exclude = [
  "protos",
  "lib_relaysms_payload_specs",
  "platforms/protocol_interfaces.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "RUF", "LOG", "G", "D"]
# Docstrings are only written where they add something, so none are required.
ignore = ["D1"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Body",
  "fastapi.Cookie",
  "fastapi.Depends",
  "fastapi.Header",
  "fastapi.Path",
  "fastapi.Query",
  "fastapi.Security",
]

[tool.ruff.lint.per-file-ignores]
# Method names come from the generated gRPC servicer.
"grpc_services/v3/servicer.py" = ["N802"]
# Generated by alembic from its template.
"migrations/versions/*" = ["D"]
# Usage examples in the help text are full shell commands.
"tests/client.py" = ["E501"]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.14"
venvPath = "."
venv = "venv"
exclude = [
  "protos",
  "lib_relaysms_payload_specs",
  "platforms/adapters",
  "venv",
  "**/__pycache__",
]

# A None where a test expects a value fails the test at runtime anyway.
[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = ["."]
reportOptionalMemberAccess = false
reportOperatorIssue = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.commitizen]
name = "cz_conventional_commits"
