[tool.ruff]
target-version = "py312"
line-length = 88
# protocol_interfaces.py is copied verbatim into adapter repositories.
extend-exclude = [
  "protos",
  "lib_relaysms_payload_specs",
  "platforms/protocol_interfaces.py",
]

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
  "SIM",
  "N",
  "RUF",
  "LOG",
  "G",
  "D",
  "PLR6301",
]
# Docstrings are only written where they add something, so none are required.
ignore = ["D1"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Body",
  "fastapi.Cookie",
  "fastapi.Depends",
  "fastapi.Header",
  "fastapi.Path",
  "fastapi.Query",
  "fastapi.Security",
]

[tool.ruff.lint.per-file-ignores]
# Method names come from the generated gRPC servicer.
"publisher/api/grpc/v3/servicer.py" = ["N802"]
# Generated by alembic from its template.
"migrations/versions/*" = ["D"]
# Usage examples in the help text are full shell commands.
"tools/client.py" = ["E501"]
# pytest groups tests into classes that don't use self.
"tests/*" = ["PLR6301"]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
venvPath = "."
venv = "venv"
exclude = [
  "protos",
  "lib_relaysms_payload_specs",
  "platforms/adapters",
  "venv",
  "**/__pycache__",
]

# A None where a test expects a value fails the test at runtime anyway.
[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = ["."]
reportOptionalMemberAccess = false
reportOperatorIssue = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# make test-e2e runs these on their own.
norecursedirs = ["e2e"]

[tool.commitizen]
name = "cz_conventional_commits"

[tool.importlinter]
root_package = "publisher"

[[tool.importlinter.contracts]]
name = "Entry points, then tasks, then domain, then infrastructure"
type = "layers"
# "|" layers may not import each other; ":" layers may.
layers = [
  "publisher.cli | publisher.api | publisher.smtp",
  "publisher.tasks",
  "publisher.keys : publisher.publications : publisher.tokens : publisher.credentials : publisher.platforms : publisher.gateway_clients",
  "publisher.config : publisher.db : publisher.models : publisher.log : publisher.errors : publisher.crypto",
]
