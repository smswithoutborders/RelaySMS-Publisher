version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "staging"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    labels:
      - "dependencies"
    ignore:
      # kombu[sqlalchemy] (via celery) pins sqlalchemy<2.1 until kombu 5.7
      - dependency-name: "sqlalchemy"
        versions: [">=2.1"]
    groups:
      python:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "staging"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "staging"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    groups:
      actions:
        patterns:
          - "*"
