name: E2E

# Installs, updates and uninstalls in a systemd container on each supported distro.
on:
  # Checks runs it before each deploy, so PRs need it only for install changes.
  pull_request:
    branches:
      - staging
      - main
    paths:
      - "install.sh"
      - "manage.sh"
      - "publisher.sh"
      - "sync-env.sh"
      - "template.env"
      - "Makefile"
      - "alembic.ini"
      - "requirements*.txt"
      - "scripts/**"
      - "deploy/**"
      - "migrations/**"
      - "tests/e2e/**"
      - ".github/workflows/e2e.yml"
  workflow_call:
  workflow_dispatch:

jobs:
  e2e:
    name: E2E (${{ matrix.distro }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    permissions:
      contents: read

    # Cancelling a push run would skip its deploy and its [migrate].
    concurrency:
      group: e2e-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}-${{ matrix.distro }}
      cancel-in-progress: true

    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu, debian]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The e2e tests only need pytest, not the app's test environment.
      - name: Install pytest
        run: pip install --disable-pip-version-check "$(grep -i '^pytest==' requirements-dev.txt)"

      - name: Run e2e tests
        run: make test-e2e PYTHON=python PYTEST_ARGS="-k ${{ matrix.distro }} -v"
