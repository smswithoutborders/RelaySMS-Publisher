name: Checks

on:
  pull_request:
    branches:
      - staging
      - main
  push:
    branches:
      - staging
      - main

jobs:
  checks:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    # Ubuntu 24.04 LTS, Debian 13 and the Docker image.
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsqlcipher-dev libmagic1

      - name: Install dependencies
        run: |
          python -m venv venv
          venv/bin/pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Get payload-specs commit
        id: specs
        run: echo "sha=$(git rev-parse HEAD:lib_relaysms_payload_specs)" >> "$GITHUB_OUTPUT"

      # The bindings don't depend on the Python version, so every matrix job shares them.
      - uses: actions/cache@v6
        id: specs-cache
        with:
          path: lib_relaysms_payload_specs/generated
          key: payload-specs-${{ runner.os }}-${{ steps.specs.outputs.sha }}

      - name: Build payload specs
        if: steps.specs-cache.outputs.cache-hit != 'true'
        run: make specs PYTHON=venv/bin/python

      - name: Build protos
        run: make protos PYTHON=venv/bin/python

      - uses: actions/cache@v6
        if: matrix.python-version == '3.14'
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run hooks
        if: matrix.python-version == '3.14'
        run: venv/bin/pre-commit run --all-files --show-diff-on-failure

      - name: Run tests
        run: venv/bin/python -m pytest

  deploy-staging:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    uses: ./.github/workflows/deploy.staging.yml
    secrets: inherit
