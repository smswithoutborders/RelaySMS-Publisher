name: Check Requirements

on:
  pull_request:
    branches:
      - staging
      - main
    paths:
      - "requirements*.txt"
      - ".github/workflows/check-requirements.yml"

jobs:
  resolve:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Dry run so conflicts fail the PR without needing the native build deps.
      - name: Resolve dependencies
        run: |
          pip install --dry-run --disable-pip-version-check \
            -r requirements.txt -r requirements-observability.txt
